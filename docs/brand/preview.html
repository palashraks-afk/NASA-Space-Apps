<!doctype html><meta charset="utf-8"><style>body{margin:0;display:grid;grid-template-columns:1fr 1fr;width:1200px;height:600px;font-family:Barlow,Segoe UI,sans-serif}
.c{display:grid;place-items:center}.d{background:#000}.l{background:#f4f6f8}.l path:first-child{fill:#1a2027}.l text{fill:#1a2027}
small{position:absolute;margin-top:240px;color:#8d99a5;letter-spacing:.2em;font-size:12px}</style>
<div class="c d"><div><img src="logo-lockup.svg" width="480"></div></div>
<div class="c l" id="lt"></div>
<div class="c d"><div style="display:flex;gap:40px;align-items:end"><img src="logo-mark.svg" width="160"><img src="logo-mark.svg" width="64"><img src="logo-mark.svg" width="32"><img src="logo-mark.svg" width="16"></div></div>
<div class="c" style="background:#0b1622"><div style="width:96px;height:96px;border-radius:22px;background:#000;display:grid;place-items:center;box-shadow:0 10px 30px #0008"><img src="logo-mark.svg" width="64"></div></div>
<script>fetch("logo-lockup.svg").then(r=>r.text()).then(t=>{document.getElementById("lt").innerHTML=t.replace('width','w').replace('<svg','<svg width="480"').replace('#EEF2F5"/>','#1a2027"/>').replace(/fill="#EEF2F5">SOL/,'fill="#1a2027">SOL')})</script>
