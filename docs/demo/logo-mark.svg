<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sol Lab">
  <title>Sol Lab</title>
  <defs>
    <linearGradient id="solB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
  </defs>
  <!-- Two halves of one sun: A and B, the two arms of a self-experiment. The right half sits
