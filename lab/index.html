<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sol Lab</title>
    <meta name="description" content="Crew health console: monitor each crew member against their own usual range, track cabin air and nutrition, and run fair self-experiments." />
  </head>
  <body>
    <div id="app">
      <div id="stage" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand"><b>Sol Lab</b><span>Crew health console</span></div>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Stations"></nav>
        <div class="status" id="status"></div>
      </header>

      <div class="nav" id="nav"></div>

      <aside class="inspector" id="inspector" aria-live="polite"></aside>

      <footer class="timeline" id="timeline"></footer>

      <div class="loading" id="loading"><b>Sol Lab</b><p id="loadingText">Loading</p></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
